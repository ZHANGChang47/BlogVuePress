<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-tool-id="bridge-demo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工具接口自检台 · iframe / postMessage</title>
<style>
  :root{
    --bg:#FFFFFF; --ink:#221D38; --muted:#6B6684; --line:rgba(45,36,90,.12);
    --violet:#6D4AE0; --mint:#0C9B82; --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:12px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
    padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);
    transition:background .4s,color .4s}
  h1{font-size:13px;margin:0 0 4px;font-weight:680}
  .sub{font:10px/1.6 var(--mono,monospace);color:var(--muted);margin:0 0 10px}
  .events{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
  .ev{font:9px/1 monospace;padding:5px 8px;border-radius:999px;
    border:1px solid var(--line);color:var(--muted)}
  .ev b{color:var(--mint);font-weight:600}
  .row{display:flex;gap:8px;align-items:center}
  button{padding:8px 14px;border-radius:8px;border:0;background:var(--violet);color:#fff;
    font:11px/1 monospace;cursor:pointer;white-space:nowrap}
  button:hover{filter:brightness(1.08)}
  .hint{font:9px/1.6 monospace;color:var(--muted);margin:0}
</style>
<script src="../../js/tool-bridge.js" defer></script>
</head>
<body>
  <h1>🔌 工具接口自检台 <span style="font:10px monospace;color:var(--muted)">/ bridge demo</span></h1>
  <p class="sub">iframe + postMessage · 主题：<span id="theme-state">light</span> · id：bridge-demo</p>
  <div class="events">
    <span class="ev">tool:ready <b>✓</b></span>
    <span class="ev">blog:theme <b>✓</b></span>
    <span class="ev">tool:resize <b>✓</b></span>
  </div>
  <div class="row">
    <button type="button" onclick="window.__reportToolHeight && window.__reportToolHeight()">上报一次高度</button>
    <p class="hint">切换右上角主题，观察这里的配色同步与主站 Event Bus 回执。</p>
  </div>
<script>
  // 这里只验证挂载、换肤、高度上报三条通道，不承载任何业务工具。
</script>
</body>
</html>
