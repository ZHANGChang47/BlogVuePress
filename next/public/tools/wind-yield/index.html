<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-tool-id="wind-yield">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>风电收益率速算 · 接口演示</title>
<style>
  :root{
    --bg:#FFFFFF; --ink:#221D38; --muted:#6B6684; --line:rgba(45,36,90,.12);
    --violet:#6D4AE0; --mint:#0C9B82; --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:12px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
    padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius);
    transition:background .4s,color .4s}
  h1{font-size:13px;margin:0 0 4px;font-weight:680}
  .sub{font:10px/1.6 var(--mono,monospace);color:var(--muted);margin:0 0 12px}
  .row{display:flex;gap:8px;align-items:center}
  input{flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
    background:transparent;color:var(--ink);font:11px/1.4 monospace}
  button{padding:8px 14px;border-radius:8px;border:0;background:var(--violet);color:#fff;
    font:11px/1 monospace;cursor:pointer;white-space:nowrap}
  button:hover{filter:brightness(1.08)}
  .out{margin-top:12px;padding:10px 12px;border-radius:8px;background:rgba(109,74,224,.07);
    font:10px/1.7 monospace;color:var(--muted);min-height:36px}
  .foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font:9px/1.5 monospace;color:var(--muted)}
  .foot b{color:var(--mint);font-weight:600}
  .warn{margin-top:10px;font:9px/1.6 monospace;color:var(--muted);opacity:.85}
</style>
<script src="../../js/tool-bridge.js" defer></script>
</head>
<body>
  <h1>⚡ 风电收益率速算 <span style="font:10px monospace;color:var(--muted)">/ embed 示例</span></h1>
  <p class="sub">iframe + postMessage · 主题：<span id="theme-state">light</span></p>
  <div class="row">
    <input id="v" value="100MW · 2200h · 0.35元/kWh" aria-label="示例输入">
    <button type="button" onclick="go()">提交</button>
  </div>
  <div class="out" id="o">等待输入。这个页面只验证「工具能否挂进主站、能否跟随换肤」。</div>
  <div class="foot">
    <span>mode: <b>embed</b></span><span>status: <b>demo</b></span><span>v0.1.0-demo</span>
  </div>
  <div class="warn">未接入真实测算模型：IRR 与回收期需要造价、税费、融资等财务参数，本示例不输出任何测算数值。</div>

<script>
function go(){
  var v=document.getElementById('v').value.trim();
  document.getElementById('o').textContent='已收到输入「'+v+'」。接口通道正常；真实测算模型尚未接入，故不输出收益率。';
  if(window.__reportToolHeight) window.__reportToolHeight();
}
</script>
</body>
</html>
